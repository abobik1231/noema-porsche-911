<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NOEMA axial drive assembly</title>
  <desc id="desc">Original isometric technical illustration of an electric motor, inverter, reduction gear and half shafts.</desc>
  <defs>
